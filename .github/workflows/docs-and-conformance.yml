name: docs-and-conformance

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  check:
    name: doc path check + conformance harness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: every repo-relative path in docs/*.md code samples exists (fusionlayerapp/adapter-protocol#19)
        run: npm run check:doc-paths

      - name: L1 conformance harness
        run: npm run validate
